[package]
name = "praxi-bevy"
description = "Bevy plugin playing praxi video"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["bevy", "video", "gamedev", "cutscene", "plugin"]
categories = ["game-development", "multimedia::video"]

[features]
default = ["audio"]
# Plays the videos' audio through Bevy's audio (docs/features/bevy.md#audio).
audio = ["bevy/bevy_audio"]

[dependencies]
praxi = { workspace = true, features = ["cue-sheet"] }
praxi-wgpu.workspace = true
wgpu.workspace = true
serde.workspace = true
bevy = { version = "0.20.1", default-features = false, features = ["std", "multi_threaded", "bevy_asset", "bevy_image", "bevy_render"] }

[dev-dependencies]
praxi-encoder.workspace = true
clap.workspace = true
bevy = { version = "0.20.1", default-features = false, features = ["std", "multi_threaded", "bevy_asset", "bevy_image", "bevy_render", "bevy_core_pipeline", "bevy_window", "bevy_winit", "x11", "wayland", "bevy_sprite", "bevy_sprite_render", "bevy_text", "default_font", "bevy_ui", "bevy_ui_render", "bevy_gizmos", "bevy_gizmos_render"] }
bevy_egui = { version = "0.43.1", default-features = false, features = ["render", "default_fonts"] }
