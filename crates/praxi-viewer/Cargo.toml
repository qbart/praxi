[package]
name = "praxi-viewer"
description = "GPU viewer for praxi files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["video", "viewer", "gamedev", "praxi"]
categories = ["multimedia::video", "game-development"]

[features]
default = ["audio"]
audio = ["dep:praxi-audio"]

[dependencies]
praxi = { workspace = true, features = ["cue-sheet"] }
praxi-wgpu.workspace = true
clap.workspace = true
wgpu.workspace = true
winit.workspace = true
pollster.workspace = true
png = "0.18"
praxi-audio = { workspace = true, optional = true }
