[package]
name = "praxi-editor"
description = "Cue editor for praxi files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["video", "subtitles", "editor", "gamedev", "praxi"]
categories = ["multimedia::video", "game-development"]

[features]
default = ["audio"]
audio = ["dep:praxi-audio"]

[dependencies]
praxi = { workspace = true, features = ["cue-sheet"] }
praxi-wgpu.workspace = true
wgpu.workspace = true
clap.workspace = true
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "wayland", "wgpu", "x11"] }
praxi-audio = { workspace = true, optional = true }
