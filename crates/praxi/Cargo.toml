[package]
name = "praxi"
description = "Video player for games: GPU block-compressed frames, events, variants"
version.workspace = true
edition.workspace = true

[features]
# Cues into game types (docs/features/cue-runtime.md#typed-cues).
serde = ["dep:serde", "praxi-format/serde"]
cue-sheet = ["serde", "praxi-format/cue-sheet"]

[dependencies]
praxi-format.workspace = true
serde = { workspace = true, optional = true }
