[package]
name = "praxi"
description = "Video player for games: GPU block-compressed frames, events, variants"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["video", "gamedev", "player", "cutscene", "texture"]
categories = ["multimedia::video", "game-development"]

[features]
# Cues into game types (docs/features/cue-runtime.md#typed-cues).
serde = ["dep:serde", "praxi-format/serde"]
cue-sheet = ["serde", "praxi-format/cue-sheet"]

[dependencies]
praxi-format.workspace = true
serde = { workspace = true, optional = true }
