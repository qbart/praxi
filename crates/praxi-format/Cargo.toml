[package]
name = "praxi-format"
description = "Reader and writer for the PRAXI container format"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["video", "container", "gamedev", "praxi"]
categories = ["multimedia::video", "parser-implementations"]

[features]
# Cues into game types (docs/features/cue-runtime.md#typed-cues).
serde = ["dep:serde"]
# Cue sheets (docs/spec/CUESHEET.md).
cue-sheet = ["serde", "dep:serde_json"]

[dependencies]
lz4_flex.workspace = true
opus1.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[package.metadata.docs.rs]
all-features = true
