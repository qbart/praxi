[package]
name = "praxi-format"
description = "Reader and writer for the PRAXI container format"
version.workspace = true
edition.workspace = true

[features]
# Cue sheets (docs/spec/CUESHEET.md).
cue-sheet = ["dep:serde", "dep:serde_json"]

[dependencies]
lz4_flex.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
