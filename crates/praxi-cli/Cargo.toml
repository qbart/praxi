[package]
name = "praxi-cli"
description = "praxi command line tool"
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
keywords = ["video", "encoder", "gamedev", "cli", "praxi"]
categories = ["command-line-utilities", "multimedia::encoding", "multimedia::video"]

[[bin]]
name = "praxi"
path = "src/main.rs"

[dependencies]
praxi.workspace = true
praxi-format = { workspace = true, features = ["cue-sheet"] }
ktx-rs.workspace = true
praxi-encoder.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
