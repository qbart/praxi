[package]
name = "praxi-cli"
description = "praxi command line tool"
version.workspace = true
edition.workspace = true

[[bin]]
name = "praxi"
path = "src/main.rs"

[dependencies]
praxi.workspace = true
praxi-format.workspace = true
ktx-rs.workspace = true
praxi-encoder.workspace = true
clap.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
