[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
praxi = { path = "crates/praxi" }
praxi-format = { path = "crates/praxi-format" }
praxi-encoder = { path = "crates/praxi-encoder" }
praxi-wgpu = { path = "crates/praxi-wgpu" }
praxi-audio = { path = "crates/praxi-audio" }
lz4_flex = "0.14"
ktx-rs = { version = "4.4.3", default-features = false }
clap = { version = "4.6", features = ["derive"] }
wgpu = "30"
# Already a dependency of wgpu.
bytemuck = "1"
winit = "0.30"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
# preserve_order keeps cue field order; arbitrary_precision lets cue sheets reject integers outside i64.
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }

# ktx-rs encoders are very slow unoptimised; keep dependencies fast in dev and test builds.
[profile.dev.package."*"]
opt-level = 3
