name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust and ALSA
        run: |
          apt-get update
          apt-get install -y --no-install-recommends pkg-config libasound2-dev
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --component clippy --target x86_64-pc-windows-gnu
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Check
        run: make check
      - name: Check Windows
        run: make check-windows

  bench:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust and ffmpeg
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          apt-get update
          apt-get install -y --no-install-recommends ffmpeg
      - name: Benchmark
        run: make bench
      - name: Examples
        run: make examples
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: bench
          path: target/bench.json
