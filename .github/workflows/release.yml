# Release binaries of praxi, praxi-viewer and praxi-editor (docs/features/releasing.md#release-binaries).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        shell: bash
        run: |
          rustup update stable
          rustup default stable
          rustc --version

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev

      - name: Build
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }} -p praxi-cli -p praxi-viewer -p praxi-editor

      - name: Package
        shell: bash
        run: |
          name="praxi-${GITHUB_REF_NAME}-${{ matrix.target }}"
          ext=""
          if [ "$RUNNER_OS" = Windows ]; then ext=".exe"; fi
          mkdir "$name"
          for bin in praxi praxi-viewer praxi-editor; do
            cp "target/${{ matrix.target }}/release/$bin$ext" "$name/"
          done
          cp README.md LICENSE-MIT LICENSE-APACHE "$name/"
          mkdir dist
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "dist/$name.zip" "$name" > /dev/null
          else
            tar czf "dist/$name.tar.gz" "$name"
          fi
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: praxi-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "praxi ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
